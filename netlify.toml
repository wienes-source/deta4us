# Deta4Us: één centrale site vanuit bestaande GitHub-repository.
# Geen duplicaat-repository en geen build-framework nodig.
[build]
  command = "mkdir -p dist && cp index.html privacy.html voorwaarden.html bedankt.html 404.html favicon.svg robots.txt sitemap.xml _redirects dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
